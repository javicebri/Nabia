[project]
name = "nabia"
version = "0.3.0"
description = "Typed, normalized access to public weather, climate, agricultural and forestry data APIs."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Javier Cebrián" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
# Runtime bounds are kept loose so consumer projects resolve easily;
# majors with known breaking changes are capped.
dependencies = [
    "httpx>=0.27,<1",
    "platformdirs>=4.0",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    # Verify TLS against the OS trust store (see nabia.core.tls).
    "truststore>=0.10.1",
    # IANA time zone database for zoneinfo on Windows.
    "tzdata>=2024.1 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
pandas = [
    # 2.2.2 is the first release built against NumPy 2.
    "pandas>=2.2.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "respx>=0.23.1",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nabia"]

# --------------------------------------------------------------------------
# Ruff: PEP 8 formatting and linting (79-char lines, 72-char docstrings).
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 79
target-version = "py312"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle (PEP 8)
    "F",        # pyflakes
    "I",        # import sorting
    "N",        # PEP 8 naming
    "D",        # docstrings
    "UP",       # modern syntax for the target Python
    "B",        # bugbear
    "S",        # bandit security checks
    "DTZ",      # naive datetimes
    "T20",      # stray print() calls
    "PT",       # pytest style
    "SIM",      # simplifications
    "C4",       # comprehensions
    "RUF",      # ruff-specific
]
ignore = [
    "D105",  # magic methods are self-explanatory
    "D107",  # __init__ is documented in the class docstring
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106"]

# --------------------------------------------------------------------------
# Mypy: strict static typing.
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------
# Pytest: live tests hit real APIs and are excluded by default.
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: calls the real provider APIs (run with: uv run pytest -m live)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["nabia"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", 'if __name__ == "__main__":']

[tool.uv]
# Verify TLS with the OS trust store (same policy as Nabia itself).
system-certs = true
