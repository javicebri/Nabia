# Enable on every commit: uv run python -m pre_commit install
# Run manually:          uv run python -m pre_commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace

  # Blocks commits that introduce credentials. Intentional fake secrets
  # in tests are marked with "# pragma: allowlist secret".
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^uv\.lock$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run python -m mypy
        language: system
        types: [python]
        pass_filenames: false

      # The generated contract must match the code it is exported from.
      - id: contract
        name: contract/ up to date
        entry: uv run python -m tools.contract --check
        language: system
        files: ^(src/nabia/|tools/|tests/providers/[^/]+/(conformance\.py|fixtures/)|contract/)
        pass_filenames: false

      # The Dart port: format, analysis, generated code and the shared
      # conformance cases.
      - id: dart
        name: dart package
        entry: uv run python -m tools.dart
        language: system
        files: ^(dart/|contract/)
        pass_filenames: false
