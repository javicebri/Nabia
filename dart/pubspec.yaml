name: nabia
description: >-
  Typed, normalized access to public weather, climate, agricultural and
  forestry data APIs. Dart port of the Nabia Python library.
# Same version as the Python package: one shared tag per release.
version: 0.4.0
repository: https://github.com/javicebri/Nabia
# Distributed from Git tags only (git + path: dart + ref: vX.Y.Z).
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  http: ^1.6.0
  timezone: ^0.11.2

dev_dependencies:
  coverage: ^1.16.0
  lints: ^6.1.0
  test: ^1.33.0
